<!DOCTYPE html>

<head>
<meta charset="utf-8">

<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#16202b;--mute:#5d6b7a;--line:#d9e0e7;--acc:#0f5c8a;--hi:#c2410c;--tab:#e4eaf0}
@media (prefers-color-scheme:dark){:root{--bg:#10171e;--card:#18222c;--ink:#e6edf3;--mute:#93a3b3;--line:#2b3947;--acc:#5cb3e6;--hi:#fb923c;--tab:#223040}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:20px 16px 8px;max-width:1100px;margin:auto}
h1{font:600 22px/1.2 Georgia,serif;margin:0 0 4px}
.sub{color:var(--mute);font-size:13px}
main{max-width:1100px;margin:auto;padding:8px 16px 40px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.mode button,.tabs button{border:1px solid var(--line);background:var(--tab);color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer;font:inherit}
.mode button.on,.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.tabs button{font-size:13px;padding:6px 10px}
input[type=search]{flex:1;min-width:180px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
label{font-size:13px;color:var(--mute)}
.sum{background:var(--card);border-left:4px solid var(--acc);padding:12px 14px;margin-bottom:14px;border-radius:0 6px 6px 0}
.sum h2{font-size:15px;margin:0 0 4px}.sum p{margin:0;color:var(--mute);font-size:14px;max-width:80ch}
.sum small{display:block;margin-top:6px;color:var(--mute)}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{font-size:12px;color:var(--mute);font-weight:600;background:var(--tab)}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.h td:nth-child(3){font-weight:600;color:var(--hi)}
.note{display:block;color:var(--mute);font-size:12.5px;margin-top:2px;max-width:60ch}
.cc{font-weight:600;color:var(--acc)}
.empty{padding:20px;color:var(--mute)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>

let mode="day",sel=12;
const $=id=>document.getElementById(id);
const dl=d=>{const x=new Date(2026,9,d);return x.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})};
const days=[...new Set(D.map(r=>r[0]))].sort((a,b)=>a-b);

function tabs(){

 $("tabs").innerHTML=list.map(k=>`<button role="tab" class="${k==sel?"on":""}" data-k="${k}">${mode=="day"?dl(k):k}</button>`).join("");
 $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{sel=mode=="day"?+b.dataset.k:b.dataset.k;render()});
}
function render(){
 tabs();
 const q=$("q").value.toLowerCase(),hi=$("hi").checked;
 let rows=D.filter(r=>(mode=="day"?r[0]==sel:r[2]==sel)&&(!hi||r[7])&&(!q||r.join(" ").toLowerCase().includes(q)));
 rows.sort((a,b)=>a[0]-b[0]||(a[1]||"99").localeCompare(b[1]||"99"));
 const s=mode=="day"?DAY[sel]:CTY[sel];
 $("sum").innerHTML=s?`<div class="sum"><h2>${mode=="day"?dl(sel)+": "+s[0]:s[0]}</h2><p>${s[1]}</p><small>${rows.length} event${rows.length==1?"":"s"} shown</small></div>`:"";
 $("out").innerHTML=rows.length?`<div class="wrap"><table><thead><tr><th>${mode=="day"?"Time":"Date / time"}</th><th>${mode=="day"?"Country":"Country"}</th><th>Event</th><th>Period</th><th>Previous</th><th>Est</th></tr></thead><tbody>${
 rows.map(r=>`<tr class="${r[7]?"h":""}"><td class="n">${mode=="day"?(r[1]||"—"):dl(r[0])+" "+r[1]}</td><td class="cc">${r[2]}</td><td>${r[3]}${r[8]?`<span class="note">${r[8]}</span>`:""}</td><td>${r[4]}</td><td class="n">${r[5]}</td><td class="n">${r[6]}</td></tr>`).join("")
 }</tbody></table></div>`:`<div class="empty">No events match. Clear the filter or switch tab.</div>`;
}
$("mDay").onclick=()=>{mode="day";sel=days[0];$("mDay").classList.add("on");$("mCty").classList.remove("on");render()};
$("mCty").onclick=()=>{mode="cty";sel="US";$("mCty").classList.add("on");$("mDay").classList.remove("on");render()};
$("q").oninput=render;$("hi").onchange=render;
render();
</script>
